name: Deploy Arabia Frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment: arabia-backend-secret

    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          set -e

          echo "$VPS_SSH_KEY" > key.pem
          chmod 600 key.pem

          export SSH_OPTIONS="-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 -i key.pem"

          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          echo "🚀 Deploying frontend release: $TIMESTAMP"

          # Ensure required directories exist
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST "
            mkdir -p $FRONTEND_PATH/releases &&
            mkdir -p $FRONTEND_PATH/shared &&
            mkdir -p $FRONTEND_PATH/releases/$TIMESTAMP
          "

          # Sync frontend code
          rsync -az frontend/ \
            --delete \
            -e "ssh $SSH_OPTIONS" \
            $VPS_USER@$VPS_HOST:$FRONTEND_PATH/releases/$TIMESTAMP/

          # Link shared .env + install + build
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST "
            cd $FRONTEND_PATH/releases/$TIMESTAMP &&

            # Link shared environment file
            if [ -f $FRONTEND_PATH/shared/.env ]; then
              ln -sfn $FRONTEND_PATH/shared/.env .env
            else
              echo '⚠️ shared/.env not found. Please create it once.'
              exit 1
            fi &&

            npm ci &&
            npm run build
          "

          # Switch current symlink
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST \
            "ln -sfn $FRONTEND_PATH/releases/$TIMESTAMP $FRONTEND_PATH/current"

          # Restart via PM2 (reload keeps zero downtime)
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST "
            cd $FRONTEND_PATH/current &&
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs &&
            pm2 save
          "

          # Cleanup old releases (keep last 5)
          ssh $SSH_OPTIONS $VPS_USER@$VPS_HOST \
            "cd $FRONTEND_PATH/releases && ls -1dt */ | tail -n +6 | xargs -r rm -rf"

          echo "✅ Frontend deployment completed successfully"
          